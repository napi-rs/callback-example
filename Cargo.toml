
[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name = "callback_demo"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12.1", features = ["async"] }
napi-derive = "3.6.3"
tokio = { version = "1.53.1", features = ["full"] }

[build-dependencies]
napi-build = "2.4.1"

[profile.release]
lto = true
strip = "symbols"
